<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Asientos - AeroCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-Cog7ZB2F.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-ClSQRkQD.css">
</head>
<body class="bg-surface p-4 md:p-8 font-sans text-gray-900">

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto bg-white rounded-3xl p-4 sm:p-6 md:p-8 shadow-sm border border-gray-100">

    <!-- Top Header -->
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Choose Seats</h1>
        <p class="text-[10px] sm:text-xs tracking-widest text-gray-400 uppercase font-mono mt-1">
          BOG &rarr; MDE &bull; A320NEO &bull; 12 SEP
        </p>
      </div>
      <div class="flex items-center gap-3">
        <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Check-in abierto
        </span>
        <div class="w-10 h-10 rounded-full bg-[#E8D4B9] flex items-center justify-center font-bold text-xs text-amber-900 shadow-inner">
          JR
        </div>
      </div>
    </header>

    <!-- ===== Interactive Aircraft Viewport Selector ===== -->
    <section class="viewport-selector mb-6" aria-label="Selector de sección del avión">

      <!-- Stage del minimap SVG con el ActiveViewportLens -->
      <div
        id="viewport-stage"
        class="viewport-stage"
        tabindex="0"
        role="application"
        aria-label="Minimapa interactivo del avión"
      >
        <!-- Fuselaje SVG -->
        <div id="fuselage-slot" class="viewport-stage__svg"></div>

        <!-- ActiveViewportLens (overlay sobre la sección activa) -->
        <div
          id="active-lens"
          class="active-lens"
          data-draggable="true"
        >
          <span id="active-lens__label" class="active-lens__label">Business</span>
        </div>
      </div>

      <!-- Tabs de secciones -->
      <div class="viewport-tabs" id="viewport-tabs">
        <button data-section="1" data-label="Business" class="viewport-tab is-active" type="button">
          <span class="viewport-tab__num">1</span>
          <span class="viewport-tab__label">Business</span>
          <span class="viewport-tab__meta">1–4</span>
        </button>
        <button data-section="2" data-label="Premium Eco." class="viewport-tab" type="button">
          <span class="viewport-tab__num">2</span>
          <span class="viewport-tab__label">Prém. Econ.</span>
          <span class="viewport-tab__meta">5–7</span>
        </button>
        <button data-section="3" data-label="Economy" class="viewport-tab" type="button">
          <span class="viewport-tab__num">3</span>
          <span class="viewport-tab__label">Económica</span>
          <span class="viewport-tab__meta">8–10</span>
        </button>
      </div>
    </section>

    <!-- Section Tabs & Legend -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-4 text-xs font-medium text-gray-500">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-gray-200"></span> Disponible
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-gray-400"></span> Ocupado
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-[#635BFF]"></span> Tu selección
        </div>
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Promo / Feature Card -->
      <div class="bg-black text-white rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden min-h-[200px] sm:min-h-[300px] order-2 lg:order-1">
        <div class="absolute -right-8 -bottom-8 w-40 h-40 bg-white/5 rounded-full"></div>
        <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/5 rounded-full"></div>
        <div class="relative z-10 flex justify-between items-start">
          <div class="w-12 h-12 bg-[#D2F843] rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
              <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
              <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
            </svg>
          </div>
          <button class="text-gray-400 hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10"/>
            </svg>
          </button>
        </div>
        <div class="relative z-10">
          <h3 class="text-lg font-bold mb-1">3D Rendering</h3>
          <p class="text-xs text-gray-400 leading-relaxed">
            Recorre la cabina de tu avión con visualización 3D y siente lo que te espera a bordo.
          </p>
        </div>
      </div>

      <!-- Seat Map Section -->
      <div class="lg:col-span-2 bg-[#F8F9FB] rounded-2xl p-4 sm:p-6 border border-gray-100 flex flex-col order-1 lg:order-2">

        <!-- Header Info -->
        <div class="flex items-center justify-between mb-4 sm:mb-6">
          <h2 class="text-sm font-bold text-gray-800" id="section-title">Sección 1 (Ventana)</h2>
          <span class="text-xs font-mono text-gray-400" id="section-info">40 asientos &bull; Desde $65</span>
        </div>

        <!-- Horizontal Matrix -->
        <div class="py-2 sm:py-4">
          <div id="seat-matrix" class="flex flex-col gap-2 sm:gap-3 w-full">
            <!-- Generated by JS -->
          </div>
        </div>

        <!-- Bottom Selection & Checkout Dock -->
        <div id="checkout-dock" class="sticky bottom-3 z-30 mt-4 sm:mt-6 bg-white rounded-2xl p-3 sm:p-4 border border-gray-100 shadow-[0_-4px_20px_rgba(17,19,22,0.08)] flex flex-col sm:flex-row items-center justify-between gap-4">
          <!-- Selected Seat Chips -->
          <div class="flex flex-wrap gap-2 min-h-[32px] justify-center sm:justify-start" id="selected-chips">
            <span class="text-xs text-gray-400 italic" id="chips-empty">Selecciona tus asientos</span>
          </div>

          <!-- Checkout Details -->
          <div class="flex items-center gap-4 sm:gap-6 w-full sm:w-auto justify-between sm:justify-end">
            <div>
              <span class="text-[10px] uppercase font-mono tracking-wider text-gray-400 block">Total</span>
              <span class="text-xl font-extrabold text-gray-900" id="dock-total">$0</span>
            </div>
            <button
              id="dock-btn"
              disabled
              class="bg-[#D2F843] hover:bg-[#c2ed29] disabled:bg-gray-200 disabled:text-gray-400 text-black font-bold text-sm px-6 py-3 rounded-full shadow-md transition-all active:scale-95 disabled:active:scale-100 disabled:cursor-not-allowed"
            >
              Confirmar (<span id="dock-count">0</span>)
            </button>
          </div>
        </div>

        <!-- Mobile Alert Toast -->
        <div id="mobile-alert" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50 bg-black text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-2">
        </div>

      </div>
    </div>
  </div>

</body>
</html>
